server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml;

    # Cache static assets (including those in /assets/ and /images/)
    # Vite build produces hashed filenames for JS/CSS in /assets, ensuring cache busting.
    # Images and other static assets can be cached for longer.
    location ~* \.(?:css|js|json|xml|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d; # Adjust as needed, 7 days is a common value
        add_header Cache-Control "public, max-age=604800";
        # access_log off; # Optional: turn off logging for static assets to reduce noise
    }

    # For custom.css, if you want to ensure it's always revalidated without aggressive no-caching:
    location = /custom.css {
        expires 1h; # Example: cache for 1 hour, browser will revalidate
        add_header Cache-Control "public, must-revalidate";
    }

    # For index.html, allow caching but encourage revalidation
    location = /index.html {
        expires 1h; # Short cache time, or use etag on (default)
        add_header Cache-Control "public, must-revalidate";
    }

    # Deny access to .git repository files/folders (defense-in-depth)
    location ~ /\.git {
        deny all;
        return 404; # Or 403
    }

    # Deny access to any .php files (defense-in-depth)
    location ~ \.php$ {
        deny all;
        return 404; # Or 403
    }

    # Handle SPA routing - this should be the last location block for / or use a more specific prefix
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (these are good)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block"; # Note: This header is deprecated by modern browsers, CSP is preferred.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # add_header Content-Security-Policy "..."; # CSP is already in your index.html via meta tag, which is fine for SPAs.
                                            # If you move it here, remove it from index.html.
} 